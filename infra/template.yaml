AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AXLR tool registry: four Lambdas, one DynamoDB table, S3 and CloudFront for the
  static catalog, HTTP APIs on our own domain (mTLS for the admin one).
  See docs/architecture.md. Nothing here has been deployed yet.

Parameters:
  DomainName:
    Type: String
    Description: The registered domain (for example axlr.dev); api., admin. and registry. are created under it.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The Route 53 hosted zone of DomainName.
  CloudFrontCertificateArn:
    Type: String
    Description: ACM certificate for registry.DomainName, issued in us-east-1 (CloudFront requires it there).
  TruststoreBucket:
    Type: String
    Description: A versioned bucket created before the stack that holds truststore/ca.pem (the private CA certificate); see the bootstrap order in docs/architecture.md.
  TruststoreVersion:
    Type: String
    Description: The S3 object version of truststore/ca.pem in TruststoreBucket.
  CatalogName:
    Type: String
    Default: axlr
  CatalogHost:
    Type: String
    Default: ''
    Description: The catalog's host name; empty means registry.DomainName (production uses DomainName itself, registry.underpassai.com).
  WebAclArn:
    Type: String
    Default: ''
    Description: The ARN of the CloudFront web ACL from infra/edge-waf.yaml (us-east-1); empty attaches none.
  TestRunnerImageUri:
    Type: String
    Description: The test-runner image in ECR, by digest (built and pushed by the release job only when infra/test-runner or the runner binary changes).
  IndexPublicKey:
    Type: String
    Description: The registry's minisign public key (the base64 line of its .pub file); admin-api verifies uploaded index signatures against it. The secret key stays offline.
  Stage:
    Type: String
    AllowedValues: [staging, production]
    Default: staging

Conditions:
  CatalogHostGiven: !Not [!Equals [!Ref CatalogHost, '']]
  WebAclGiven: !Not [!Equals [!Ref WebAclArn, '']]

Globals:
  Function:
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        ARTIFACTS_BUCKET: !Ref Artifacts
        CATALOG_NAME: !Ref CatalogName
        STAGE: !Ref Stage

Resources:
  # ---------------------------------------------------------------- data
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1   # the reviewer's queue: status -> submitted_at
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      # Idempotency records, used nonces and rate windows expire by themselves.
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }

  Artifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-rejected-quarantine   # publish-api writes a rejected upload under quarantine/rejected/<name>/<version>/
            Status: Enabled
            Prefix: quarantine/rejected/
            ExpirationInDays: 90

  # ------------------------------------------------------- static catalog
  # Only AXLR clients read the catalog: a viewer-request function (free tier: 2 M invocations a month)
  # answers 403 unless the User-Agent starts with "axlr". Identification, not authentication: the
  # catalog is public data signed by the registry key; the gate keeps scanners and browsers out.
  AxlrClientsOnly:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-axlr-clients-only
      AutoPublish: true
      FunctionConfig: { Comment: 'Refuse viewers whose User-Agent is not AXLR', Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var agent = (event.request.headers['user-agent'] || {}).value || '';
          if (agent.substring(0, 4).toLowerCase() !== 'axlr') {
            return { statusCode: 403, statusDescription: 'Forbidden', headers: { 'content-type': { value: 'application/json' } }, body: '{"error":"forbidden: client is not AXLR"}' };
          }
          return event.request;
        }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-published
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases: [!If [CatalogHostGiven, !Ref CatalogHost, !Sub 'registry.${DomainName}']]
        WebACLId: !If [WebAclGiven, !Ref WebAclArn, !Ref AWS::NoValue]
        ViewerCertificate:
          AcmCertificateArn: !Ref CloudFrontCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        Origins:
          - Id: published
            DomainName: !GetAtt Artifacts.RegionalDomainName
            OriginPath: /published
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: published
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
          Compress: true
          FunctionAssociations:
            - { EventType: viewer-request, FunctionARN: !GetAtt AxlrClientsOnly.FunctionMetadata.FunctionARN }

  PublishedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Artifacts
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${Artifacts.Arn}/published/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  RegistryRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !If [CatalogHostGiven, !Ref CatalogHost, !Sub 'registry.${DomainName}']
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # CloudFront's fixed hosted zone id

  # ---------------------------------------------------------------- APIs
  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub 'api.${DomainName}'
      SubjectAlternativeNames: [!Sub 'admin.${DomainName}']
      ValidationMethod: DNS
      DomainValidationOptions:
        - { DomainName: !Sub 'api.${DomainName}', HostedZoneId: !Ref HostedZoneId }
        - { DomainName: !Sub 'admin.${DomainName}', HostedZoneId: !Ref HostedZoneId }

  PublishApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Domain:
        DomainName: !Sub 'api.${DomainName}'
        CertificateArn: !Ref ApiCertificate
        EndpointConfiguration: REGIONAL
        SecurityPolicy: TLS_1_2
        Route53: { HostedZoneId: !Ref HostedZoneId }
      DisableExecuteApiEndpoint: true
      DefaultRouteSettings: { ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10 }   # requests per second, per stage

  AdminApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Domain:
        DomainName: !Sub 'admin.${DomainName}'
        CertificateArn: !Ref ApiCertificate
        EndpointConfiguration: REGIONAL
        SecurityPolicy: TLS_1_2
        MutualTlsAuthentication:
          TruststoreUri: !Sub s3://${TruststoreBucket}/truststore/ca.pem
          TruststoreVersion: !Ref TruststoreVersion
        Route53: { HostedZoneId: !Ref HostedZoneId }
      DisableExecuteApiEndpoint: true   # mTLS is enforced for every request
      DefaultRouteSettings: { ThrottlingBurstLimit: 10, ThrottlingRateLimit: 5 }

  # ------------------------------------------------------------- Lambdas
  PublishFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: provided.al2023
      ReservedConcurrentExecutions: 5   # bounds the cost of a flood; the gateway throttles first
      CodeUri: ../target/lambda/publish-api/   # bootstrap built by `cargo lambda build --release --arm64 --workspace` (the release job's build artifact)
      Handler: bootstrap
      Environment:
        Variables:
          TEST_RUNNER_FUNCTION: !Ref TestRunnerFunction
      Events:
        # The Lambda routes: POST /v1/versions, GET /v1/versions/{name}/{version},
        # POST /v1/publishers/enroll, POST /v1/publishers/{id}/keys (docs/api.md).
        Publish:
          Type: HttpApi
          Properties: { ApiId: !Ref PublishApi, Path: '/v1/{proxy+}', Method: ANY }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3WritePolicy: { BucketName: !Ref Artifacts }
        - LambdaInvokePolicy: { FunctionName: !Ref TestRunnerFunction }

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: provided.al2023
      ReservedConcurrentExecutions: 3   # bounds the cost of a flood; the gateway throttles first
      CodeUri: ../target/lambda/admin-api/   # bootstrap built by `cargo lambda build --release --arm64 --workspace` (the release job's build artifact)
      Handler: bootstrap
      Environment:
        Variables:
          INDEX_PUBLISHER_FUNCTION: !Ref IndexPublisherFunction
          INDEX_PUBLIC_KEY: !Ref IndexPublicKey
          DISTRIBUTION_ID: !Ref Distribution
      Events:
        Admin:
          Type: HttpApi
          Properties: { ApiId: !Ref AdminApi, Path: '/v1/{proxy+}', Method: ANY }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref Artifacts }
        - LambdaInvokePolicy: { FunctionName: !Ref IndexPublisherFunction }
        - Statement:
            - Effect: Allow
              Action: cloudfront:CreateInvalidation
              Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  IndexPublisherFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: provided.al2023
      ReservedConcurrentExecutions: 1   # bounds the cost of a flood; the gateway throttles first
      CodeUri: ../target/lambda/index-publisher/   # bootstrap built by `cargo lambda build --release --arm64 --workspace` (the release job's build artifact)
      Handler: bootstrap
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }   # reads tools and publishers, appends its audit entry
        - S3CrudPolicy: { BucketName: !Ref Artifacts }

  # The test runner needs python3, bash and node, so it is a container image,
  # and it runs in an isolated subnet: no NAT, no internet gateway, only the
  # free gateway endpoints to S3 and DynamoDB. A tool under test has no network.
  TestRunnerFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref TestRunnerImageUri
      ReservedConcurrentExecutions: 2
      Timeout: 120
      MemorySize: 512
      VpcConfig:
        SubnetIds: [!Ref IsolatedSubnet]
        SecurityGroupIds: [!Ref RunnerSecurityGroup]
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref Artifacts }
        - S3WritePolicy: { BucketName: !Ref Artifacts }

  Vpc:
    Type: AWS::EC2::VPC
    Properties: { CidrBlock: 10.42.0.0/24, EnableDnsSupport: true, EnableDnsHostnames: true }
  IsolatedSubnet:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref Vpc, CidrBlock: 10.42.0.0/26 }
  IsolatedRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  IsolatedSubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref IsolatedSubnet, RouteTableId: !Ref IsolatedRouteTable }
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref IsolatedRouteTable]
  DynamoDbEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref IsolatedRouteTable]
  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: test-runner. The subnet route table reaches only the gateway endpoints, so 443 anywhere is 443 to S3 and DynamoDB
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

Outputs:
  PublishApiUrl:
    Value: !Sub https://api.${DomainName}
  AdminApiUrl:
    Value: !Sub https://admin.${DomainName}
  CatalogUrl:
    Value: !If [CatalogHostGiven, !Sub 'https://${CatalogHost}/index.json', !Sub 'https://registry.${DomainName}/index.json']
  TableName:
    Value: !Ref Table
  ArtifactsBucket:
    Value: !Ref Artifacts
