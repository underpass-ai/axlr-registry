# Fast feedback on every push and pull request: format, lint, unit and
# use-case tests. Minutes, with the registry and target directory cached.
name: ci-dev

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04-arm   # free on public repositories; the Lambdas are arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace
